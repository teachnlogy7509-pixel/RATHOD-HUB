<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#020617"><link rel="manifest" href="controller.webmanifest"><title>RATHOD Controller</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;background:#020617;color:#fff;max-width:700px;margin:auto;padding:22px}.card{background:#0f172a;border:1px solid #334155;border-radius:22px;padding:18px;margin:14px 0}input,button{box-sizing:border-box;width:100%;padding:13px;margin:6px 0;border-radius:12px;border:0}input{background:#1e293b;color:#fff}button{background:#0891b2;color:#fff;font-weight:800}.off{background:#b91c1c}.on{background:#047857}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}small{color:#94a3b8}</style></head><body><h1>🔐 RATHOD Controller</h1><div id="setup" class="card"><b>One-time secure setup</b><input id="url" placeholder="Supabase project URL"><input id="key" type="password" placeholder="Supabase anon key"><button onclick="saveSetup()">Save</button></div><div id="login" class="card"><input id="email" type="email" placeholder="Owner/manager email"><input id="pass" type="password" placeholder="Password"><button onclick="login()">Secure login</button></div><div id="app" class="card" hidden><div id="status"></div><div id="buttons" class="grid"></div><input id="msg" placeholder="Maintenance message"><button onclick="save()">Apply control</button><button onclick="logout()">Logout</button></div><script>let db,s;const names={master_enabled:'MASTER',hub_enabled:'HUB',quiz_bot_enabled:'QUIZ BOT',sakhi_enabled:'SAKHI',pdf_worker_enabled:'PDF WORKER'};function init(){const u=localStorage.rh_supa_url,k=localStorage.rh_supa_key;if(!u||!k)return;db=supabase.createClient(u,k);setup.hidden=true;db.auth.getSession().then(x=>{if(x.data.session)load()})}function saveSetup(){localStorage.rh_supa_url=url.value.trim();localStorage.rh_supa_key=key.value.trim();location.reload()}async function login(){const r=await db.auth.signInWithPassword({email:email.value,password:pass.value});if(r.error)return alert(r.error.message);load()}async function load(){let r=await db.rpc('get_rathod_system_control');if(r.error)return alert(r.error.message);s=r.data;if(!s.can_control)return alert('Controller permission नहीं है');login.hidden=true;app.hidden=false;render()}function render(){status.innerHTML=`Role: <b>${s.control_role}</b> • Updated: ${new Date(s.updated_at).toLocaleString()}`;buttons.innerHTML=Object.entries(names).map(([k,n])=>`<button class="${s[k]?'on':'off'}" onclick="s.${k}=!s.${k};render()">${n}: ${s[k]?'ON':'OFF'}</button>`).join('');msg.value=s.maintenance_message||''}async function save(){const r=await db.rpc('set_rathod_system_control',{p_master:s.master_enabled,p_hub:s.hub_enabled,p_quiz_bot:s.quiz_bot_enabled,p_sakhi:s.sakhi_enabled,p_pdf_worker:s.pdf_worker_enabled,p_message:msg.value});if(r.error)return alert(r.error.message);alert('Saved ✓');load()}async function logout(){await db.auth.signOut();location.reload()}init();</script></body></html>
