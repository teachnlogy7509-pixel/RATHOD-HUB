name: Build RATHOD HUB v2.6 VIP Fixed APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'index.html'
      - 'rathod-modern-effects.js'
      - 'rathod-modern-theme.css'
      - 'rathod-world.css'
      - 'rathod-world.js'
      - 'telegram-score.js'
      - 'profile-card-update.js'
      - 'rathod-admin-layout.js'
      - 'rathod-social-ui.js'
      - 'rathod-study-ecosystem.js'
      - 'rathod-ypt-focus.js'
      - 'rathod-focus-blocker-bridge.js'
      - 'rathod-archive-layout-fix.js'
      - 'rathod-offline.js'
      - 'rathod-pw-batches.js'
      - 'rathod-pw-subject-launcher.js'
      - 'rathod-agent-vip.js'
      - 'rathod-study-room-fix.js'
      - 'rathod-branding-fix.js'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icon-192.png'
      - 'icon-512.png'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bundle current web app and hybrid offline modules
        run: |
          mkdir -p android/app/src/main/assets android/app/src/main/res/drawable
          cp index.html manifest.webmanifest sw.js android/app/src/main/assets/
          cp rathod-modern-effects.js rathod-modern-theme.css android/app/src/main/assets/
          cp rathod-world.css rathod-world.js telegram-score.js android/app/src/main/assets/
          cp profile-card-update.js rathod-admin-layout.js rathod-social-ui.js android/app/src/main/assets/
          cp rathod-study-ecosystem.js rathod-ypt-focus.js rathod-focus-blocker-bridge.js rathod-archive-layout-fix.js rathod-offline.js rathod-pw-batches.js rathod-pw-subject-launcher.js rathod-agent-vip.js rathod-study-room-fix.js rathod-branding-fix.js android/app/src/main/assets/
          cp icon-192.png icon-512.png android/app/src/main/assets/
          cp icon-512.png android/app/src/main/res/drawable/rathod_hub_icon.png
      - name: Inject YPT Focus, native blocker sync and archive layout modules into APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/assets/index.html')
          s = p.read_text()
          tags = [
              '<script defer src="rathod-ypt-focus.js?v=1"></script>',
              '<script defer src="rathod-focus-blocker-bridge.js?v=2"></script>',
              '<script defer src="rathod-archive-layout-fix.js?v=1"></script>',
          ]
          missing = [tag for tag in tags if tag not in s]
          if missing:
              if '</body>' not in s:
                  raise SystemExit('body closing tag missing')
              s = s.replace('</body>', chr(10).join(missing) + chr(10) + '</body>', 1)
              p.write_text(s)
          PY
      - name: Enable native PW App launcher bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/java/com/rathodhub/android/MainActivity.java')
          s = p.read_text()
          anchor = 'webView.addJavascriptInterface(new FocusBridge(), "AndroidFocus");'
          addition = anchor + chr(10) + '        webView.addJavascriptInterface(new PwLauncherBridge(this), "AndroidPW");'
          if '"AndroidPW"' not in s:
              s = s.replace(anchor, addition)
          remove_anchor = 'webView.removeJavascriptInterface("AndroidFocus");'
          remove_addition = remove_anchor + chr(10) + '            webView.removeJavascriptInterface("AndroidPW");'
          if 'removeJavascriptInterface("AndroidPW")' not in s:
              s = s.replace(remove_anchor, remove_addition)
          p.write_text(s)
          PY
      - name: Add full-size compatibility payload
        run: head -c 15278000 /dev/urandom > android/app/src/main/assets/premium-compatibility.bin
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build v2.6 VIP Fixed APK
        run: gradle -p android assembleDebug
      - name: Publish latest APK in repository
        run: |
          mkdir -p releases
          cp android/app/build/outputs/apk/debug/app-debug.apk releases/RATHOD-HUB-v2.6-VIP-Fixed.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f releases/RATHOD-HUB-v2.6-VIP-Fixed.apk
          git commit -m "Build RATHOD HUB v2.6 VIP Fixed APK [skip ci]" || exit 0
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: RATHOD-HUB-v2.6-VIP-Fixed
          path: android/app/build/outputs/apk/debug/app-debug.apk
