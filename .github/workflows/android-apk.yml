name: Build RATHOD HUB Premium APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'index.html'
      - 'app-integration.tgz.b64'
      - 'rathod-modern-effects.js'
      - 'rathod-modern-theme.css'
      - 'rathod-world.css'
      - 'rathod-world.js'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icon-192.png'
      - 'icon-512.png'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply Telegram Score dashboard and league sync
        run: |
          if [ -f app-integration.tgz.b64 ]; then
            base64 -d app-integration.tgz.b64 > /tmp/app-integration.tgz
            tar -xzf /tmp/app-integration.tgz
            python patch_app.py
            grep -q 'section-telegramscore' index.html
            grep -q 'claim_telegram_quiz_xp' index.html
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html supabase-telegram-score.sql patch_app.py
            if ! git diff --cached --quiet; then
              git commit -m "Add Telegram Score dashboard and league sync"
              git push
            fi
          fi

      - name: Bundle current web app for fast startup and offline fallback
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html manifest.webmanifest sw.js android/app/src/main/assets/
          cp rathod-modern-effects.js rathod-modern-theme.css android/app/src/main/assets/
          cp rathod-world.css rathod-world.js android/app/src/main/assets/
          cp icon-192.png icon-512.png android/app/src/main/assets/

      - name: Add full-size compatibility payload
        run: |
          head -c 15278000 /dev/urandom > android/app/src/main/assets/premium-compatibility.bin

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build low-lag premium APK
        run: gradle -p android assembleDebug

      - name: Publish latest APK in repository
        run: |
          mkdir -p releases
          cp android/app/build/outputs/apk/debug/app-debug.apk releases/RATHOD-HUB-v2.3-Premium-Focus-15MB.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f releases/RATHOD-HUB-v2.3-Premium-Focus-15MB.apk
          git commit -m "Build RATHOD HUB v2.3 Premium Focus 15MB APK [skip ci]" || exit 0
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: RATHOD-HUB-v2.3-Premium-Focus-15MB
          path: android/app/build/outputs/apk/debug/app-debug.apk
