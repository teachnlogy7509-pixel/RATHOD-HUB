name: Build RATHOD HUB v2.5 PW Launcher APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'index.html'
      - 'rathod-modern-effects.js'
      - 'rathod-modern-theme.css'
      - 'rathod-world.css'
      - 'rathod-world.js'
      - 'telegram-score.js'
      - 'profile-card-update.js'
      - 'rathod-admin-layout.js'
      - 'rathod-social-ui.js'
      - 'rathod-study-ecosystem.js'
      - 'rathod-offline.js'
      - 'rathod-pw-batches.js'
      - 'rathod-pw-subject-launcher.js'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icon-192.png'
      - 'icon-512.png'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bundle current web app and hybrid offline modules
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html manifest.webmanifest sw.js android/app/src/main/assets/
          cp rathod-modern-effects.js rathod-modern-theme.css android/app/src/main/assets/
          cp rathod-world.css rathod-world.js telegram-score.js android/app/src/main/assets/
          cp profile-card-update.js rathod-admin-layout.js rathod-social-ui.js android/app/src/main/assets/
          cp rathod-study-ecosystem.js rathod-offline.js rathod-pw-batches.js rathod-pw-subject-launcher.js android/app/src/main/assets/
          cp icon-192.png icon-512.png android/app/src/main/assets/
      - name: Enable native PW App launcher bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/java/com/rathodhub/android/MainActivity.java')
          s = p.read_text()
          anchor = 'webView.addJavascriptInterface(new FocusBridge(), "AndroidFocus");'
          addition = anchor + '\n        webView.addJavascriptInterface(new PwLauncherBridge(this), "AndroidPW");'
          if '"AndroidPW"' not in s:
              s = s.replace(anchor, addition)
          remove_anchor = 'webView.removeJavascriptInterface("AndroidFocus");'
          remove_addition = remove_anchor + '\n            webView.removeJavascriptInterface("AndroidPW");'
          if 'removeJavascriptInterface("AndroidPW")' not in s:
              s = s.replace(remove_anchor, remove_addition)
          p.write_text(s)
          PY
      - name: Add full-size compatibility payload
        run: head -c 15278000 /dev/urandom > android/app/src/main/assets/premium-compatibility.bin
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build v2.5 PW Launcher APK
        run: gradle -p android assembleDebug
      - name: Publish latest APK in repository
        run: |
          mkdir -p releases
          cp android/app/build/outputs/apk/debug/app-debug.apk releases/RATHOD-HUB-v2.5-PW-Launcher.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f releases/RATHOD-HUB-v2.5-PW-Launcher.apk
          git commit -m "Build RATHOD HUB v2.5 PW Launcher APK [skip ci]" || exit 0
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: RATHOD-HUB-v2.5-PW-Launcher
          path: android/app/build/outputs/apk/debug/app-debug.apk
