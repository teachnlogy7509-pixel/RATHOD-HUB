name: Apply RATHOD HUB HTML Update
on:
  workflow_dispatch:
  push:
    paths: ['patch_html.py','telegram-score.js','supabase-telegram-score.sql','.github/workflows/android-apk.yml']
permissions:
  contents: write
jobs:
  update-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python patch_html.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Load Telegram Score in live HTML app"
          git push
